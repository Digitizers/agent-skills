# Gitleaks configuration for agent-skills (issue #24).
#
# Division of labor: tools/portability/validate.py enforces structural
# hygiene on the checked-out tip (including placeholder-only env
# templates); gitleaks detects credential values across the FULL git
# history; human review stays the final gate.
#
# Policy: NO path-wide allowlists. The validator only sees the tip, so a
# path exemption here would blind the history scan to a credential that
# once lived in that file — exactly the leak this layer exists to catch.
# If a finding must be suppressed, add a per-finding fingerprint to
# .gitleaksignore with a comment explaining why, and have it reviewed.
#
# Baseline: .gitleaksignore at the repo root holds per-finding fingerprints,
# each with a comment naming what it is and why it is exempt. Every current
# entry is a synthetic fixture for the handoff gate's own regression suite,
# living only in already-pushed history; the tip builds those strings at
# runtime instead of committing the literal.

[extend]
useDefault = true
