name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history for secrets
        run: ./gitleaks git . --config .gitleaks.toml --no-banner --redact
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python3 -m pip install -r tools/trigger-eval/requirements.txt
      - name: Validate portable public skills
        run: |
          python3 tools/trigger-eval/validate_spec.py
          python3 tools/portability/validate.py \
            --repo . \
            --visibility public \
            --require-cloud-links \
            --require-agent-plugins-manifest
      - name: Run the standalone trigger tooling suite
        run: python3 tools/trigger-eval/test_tools.py
      - name: Run portability unit tests
        run: python3 -m unittest discover -s tools/portability -p 'test_*.py'
      - name: Run plugin cache GC unit tests
        run: python3 tools/plugin-cache-gc/test_plugin_cache_gc.py
